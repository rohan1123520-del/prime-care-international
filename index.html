<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prime Care International | Used Clothing Exporter</title>

<style>

*{
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#17324d;
    background:#f7fafc;
}

:root{
    --blue:#075b9a;
    --dark-blue:#043f6b;
    --green:#159447;
    --light-green:#8ee6ad;
    --soft-green:#effaf3;
    --gray:#667788;
}


/* TOP BRAND */

.top-brand{
    background:linear-gradient(90deg,var(--blue),#0870b7);
    color:white;
    text-align:center;
    padding:18px 15px;
}

.top-brand h1{
    margin:0;
    font-size:30px;
    letter-spacing:2px;
    font-weight:800;
}

.top-brand p{
    margin:7px 0 0;
    font-size:15px;
}


/* HEADER */

header{
    background:#fff;
    min-height:82px;
    padding:8px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
    border-bottom:4px solid var(--green);
    box-shadow:0 3px 18px rgba(0,0,0,.08);
    position:relative;
    z-index:10;
}

.logo-area img{
    height:65px;
    width:auto;
    object-fit:contain;
    display:block;
}

nav{
    display:flex;
    gap:30px;
    align-items:center;
}

nav a{
    color:var(--blue);
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
    transition:.3s;
    position:relative;
}

nav a:hover{
    color:var(--green);
}


/* HERO */

.hero{
    position:relative;
    min-height:680px;
    display:flex;
    align-items:center;
    padding:90px 7%;
    overflow:hidden;
    color:white;

    /*
      YOUR PHOTO
      Keep pic.jpeg in same folder as index.html
    */

    background-image:
        linear-gradient(
            90deg,
            rgba(2,42,70,.78) 0%,
            rgba(3,64,98,.50) 40%,
            rgba(4,87,122,.20) 100%
        ),
        url("./pic.jpeg");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.08);
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:700px;
}

.hero-tag{
    display:inline-block;
    background:var(--green);
    color:white;
    padding:10px 20px;
    border-radius:30px;
    font-size:14px;
    font-weight:bold;
    margin-bottom:22px;
}

.hero h2{
    font-size:54px;
    line-height:1.08;
    margin:0 0 22px;
    font-weight:800;
}

.hero h2 span{
    display:block;
    color:var(--light-green);
}

.hero p{
    font-size:20px;
    line-height:1.65;
    margin:0 0 22px;
    max-width:650px;
    color:#f4fbff;
}


/* BUTTON */

.btn{
    display:inline-block;
    background:var(--green);
    color:white;
    padding:16px 30px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    margin-top:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    transition:.3s;
}

.btn:hover{
    background:#0f7738;
    transform:translateY(-3px);
}


/* INFO BAR */

.info-bar{
    background:white;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    padding:28px 7%;
    box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.info-item{
    text-align:center;
    min-width:230px;
    padding:5px 15px;
}

.info-item strong{
    display:block;
    color:var(--blue);
    margin-bottom:7px;
    font-size:16px;
}

.info-item span{
    color:var(--gray);
    font-size:15px;
}


/* GENERAL SECTIONS */

section:not(.hero){
    padding:80px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:48px;
}

.section-title h2{
    font-size:38px;
    color:var(--blue);
    margin:0 0 13px;
    font-weight:800;
}

.section-title p{
    color:var(--gray);
    font-size:17px;
    margin:0;
}


/* PRODUCTS */

#products{
    background:#f7fafc;
}

.cards{
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
}

.card{
    width:300px;
    min-height:250px;
    background:white;
    padding:38px 28px;
    text-align:center;
    border-radius:16px;
    border-top:5px solid var(--green);
    box-shadow:0 7px 28px rgba(0,0,0,.08);
    transition:.35s;
}

.card:hover{
    transform:translateY(-9px);
}

.card-icon{
    width:75px;
    height:75px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background
